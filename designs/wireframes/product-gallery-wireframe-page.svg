<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 610" role="img" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>商品画册整页结构线稿</title>
<desc>桌面端画册页自上而下：intro 区、工具栏、四列卡片网格、分页，标注间距与断点规则</desc>
<rect width="680" height="610" fill="#071014"/>
